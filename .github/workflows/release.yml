name: release

# Publishes @stealth-code/backrefs-mcp to npm when a v* tag is pushed, through npm trusted
# publishing (OIDC): no npm token is stored anywhere, and npm attaches a
# provenance statement tying the package to this repository and run.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or newer.
      - run: npm install -g npm@^11.5.1
      - run: npm ci
      - run: npm run check-types
      - run: npm test
      - run: npm run build
      - run: npm publish --provenance --access public
